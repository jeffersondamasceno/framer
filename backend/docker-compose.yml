services:
  postgres:
    image: postgres:16-alpine
    container_name: framer-postgres
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: framer_db
    ports:
      - "5432:5432"
    volumes:
      - framer_pgdata:/var/lib/postgresql/data

volumes:
  framer_pgdata: